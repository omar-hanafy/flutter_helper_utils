name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-minimum:
    name: Test on minimum (3.47.7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (minimum)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Verify minimum SDK versions
        run: |
          set -euo pipefail
          flutter --version --machine | python3 -c '
          import json, sys
          versions = json.load(sys.stdin)
          assert versions["frameworkVersion"] == "3.47.7", versions
          assert versions["dartSdkVersion"].split()[0] == "3.13.5", versions
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Validate agent plugin
        run: dart run tool/validate_agent_plugin.dart

      - name: Test
        run: flutter test

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Resolve lower-bound dependencies
        run: flutter pub downgrade

      - name: Analyze lower-bound dependencies
        run: flutter analyze

      - name: Test lower-bound dependencies
        run: flutter test

      - name: Resolve example lower-bound dependencies
        working-directory: example
        run: flutter pub downgrade

      - name: Analyze example lower-bound dependencies
        working-directory: example
        run: flutter analyze

      - name: Test example with lower-bound dependencies
        working-directory: example
        run: flutter test

  test-stable:
    name: Test on stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Version channel check
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          if [[ "$TARGET_BRANCH" == 'main' && ! "$version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $version."
            exit 1
          fi
          if [[ "$TARGET_BRANCH" == 'dev' && ! "$version" =~ $prerelease_pattern ]]; then
            echo "dev requires a -dev.N prerelease semantic version, got $version."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Validate agent plugin
        run: dart run tool/validate_agent_plugin.dart

      - name: Test
        run: flutter test

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Build example for web
        working-directory: example
        run: flutter build web

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Java 17 for Flutter Android builds
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Build example for Android
        working-directory: example
        run: flutter build apk --debug

      - name: Lint example Android scaffold
        working-directory: example/android
        run: ./gradlew :app:lintDebug --no-daemon

  test-linux-example:
    name: Test Linux example
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install Linux desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb xauth

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build example for Linux
        working-directory: example
        run: flutter build linux --debug

      - name: Test running Linux example
        working-directory: example
        run: xvfb-run -a flutter test integration_test/showcase_test.dart -d linux

  test-apple-example:
    name: Test Apple example
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build example for iOS Simulator
        working-directory: example
        run: flutter build ios --simulator --debug --no-codesign

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build example for macOS
        working-directory: example
        run: flutter build macos --debug

      - name: Test running macOS example
        working-directory: example
        run: flutter test integration_test/showcase_test.dart -d macos

  test-beta:
    name: Test on beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (beta)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: beta

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install pana
        run: dart pub global activate pana 0.23.14

      - name: Run pana (full score required)
        run: pana --exit-code-threshold 0 .
