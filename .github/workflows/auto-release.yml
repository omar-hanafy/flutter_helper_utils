name: Auto release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare package versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          before="$BEFORE_SHA"
          if [[ "$before" =~ ^0+$ ]]; then
            echo 'Branch creation detected; no release tag will be created.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          package=$(awk '/^name:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          new_version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          if [[ "$package" != 'flutter_helper_utils' || -z "$new_version" ]]; then
            echo 'Unable to read the expected package name and version from pubspec.yaml.'
            exit 1
          fi
          if git cat-file -e "$before:pubspec.yaml" 2>/dev/null; then
            old_version=$(git show "$before:pubspec.yaml" | awk '/^version:/ {print $2; exit}' | tr -d "\"'")
          else
            old_version=''
          fi
          if [[ "$old_version" == "$new_version" ]]; then
            echo "Version remains $new_version; no release tag will be created."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          if [[ "$GITHUB_REF_NAME" == 'main' && ! "$new_version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $new_version."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == 'dev' && ! "$new_version" =~ $prerelease_pattern ]]; then
            echo "dev requires a -dev.N prerelease semantic version, got $new_version."
            exit 1
          fi
          {
            echo 'changed=true'
            echo "value=$new_version"
            echo "tag=$package-v$new_version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag is new
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          remote_tags=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || [[ -n "$remote_tags" ]]; then
            echo "Tag $RELEASE_TAG already exists. Never move or reuse a release tag."
            exit 1
          fi

      - name: Prepare release notes
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="$RELEASE_VERSION" '
            $0 == "## " version { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "No changelog notes found for $RELEASE_VERSION."
            exit 1
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_PAT }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          args=("$RELEASE_TAG" --verify-tag --notes-file "$notes" --target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_NAME" == 'dev' ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
